<main class="hero">
    <div class="glass">
        <p class="small">GET IN TOUCH</p>

        <h1>Contact <span>Me</span></h1>

        <p>
            Thanks for visiting my website!
        </p>

        <a class="button" href="index.html">
            ← Home
        </a>
    </div>
</main>

<script>
    // Initialize nav buttons
    document.addEventListener('DOMContentLoaded', function() {
        // Dark mode toggle
        const darkModeBtn = document.querySelector('.nav-btn.dark-mode');
        if (darkModeBtn) {
            darkModeBtn.addEventListener('click', function(e) {
                e.preventDefault();
                document.body.classList.toggle('dark-mode');
                const isDark = document.body.classList.contains('dark-mode');
                localStorage.setItem('darkMode', isDark);
                // Update button icon/state
                const icon = darkModeBtn.querySelector('svg');
                if (icon) {
                    const path1 = icon.querySelector('path[d*="M21 12.79"]');
                    const path2 = icon.querySelector('path[d*="M11 8"]');
                    if (isDark) {
                        if (path1) path1.setAttribute('fill', '#fff');
                        if (path2) path2.setAttribute('fill', '#fff');
                    } else {
                        if (path1) path1.setAttribute('fill', 'currentColor');
                        if (path2) path2.setAttribute('fill', 'currentColor');
                    }
                }
            });
        }

        // Mobile menu toggle
        const menuToggle = document.querySelector('.menu-toggle');
        const navMenu = document.querySelector('.nav-menu');
        
        if (menuToggle && navMenu) {
            menuToggle.addEventListener('click', function() {
                const isExpanded = menuToggle.getAttribute('aria-expanded') === 'true';
                menuToggle.setAttribute('aria-expanded', !isExpanded);
                menuToggle.classList.toggle('active');
                navMenu.classList.toggle('active');
                document.body.classList.toggle('no-scroll', !isExpanded);
            });

            // Close menu when clicking links
            const navLinksList = navMenu.querySelectorAll('.links a');
            navLinksList.forEach(link => {
                link.addEventListener('click', function() {
                    menuToggle.classList.remove('active');
                    navMenu.classList.remove('active');
                    menuToggle.setAttribute('aria-expanded', 'false');
                    document.body.classList.remove('no-scroll');
                });
            });
        }

        // Apply saved dark mode preference
        if (localStorage.getItem('darkMode') === 'true') {
            document.body.classList.add('dark-mode');
        }

        // Copy link button
        const copyLinkBtn = document.querySelector('.nav-btn.copy-link');
        if (copyLinkBtn) {
            copyLinkBtn.addEventListener('click', function(e) {
                e.preventDefault();
                navigator.clipboard.writeText(window.location.href).then(function() {
                    // Visual feedback
                    const originalText = copyLinkBtn.querySelector('span').textContent;
                    copyLinkBtn.querySelector('span').textContent = 'Copied!';
                    setTimeout(function() {
                        copyLinkBtn.querySelector('span').textContent = originalText;
                    }, 2000);
                });
            });
        }

        // Share button
        const shareBtn = document.querySelector('.nav-btn.share');
        if (shareBtn) {
            shareBtn.addEventListener('click', function(e) {
                e.preventDefault();
                if (navigator.share) {
                    navigator.share({
                        title: 'My Website',
                        text: 'Check out my website built with HTML and CSS',
                        url: window.location.href
                    }).then(() => {
                        // Success
                    }).catch(() => {
                        // Fallback - copy link
                        navigator.clipboard.writeText(window.location.href);
                    });
                } else {
                    navigator.clipboard.writeText(window.location.href);
                }
            });
        }

        // Favorites button
        const favoritesBtn = document.querySelector('.nav-btn.favorites');
        if (favoritesBtn) {
            // Check localStorage for favorites
            const favorites = JSON.parse(localStorage.getItem('favorites') || '[]');
            const isFavorite = favorites.includes(window.location.pathname);
            
            favoritesBtn.classList.toggle('active', isFavorite);
            
            favoritesBtn.addEventListener('click', function(e) {
                e.preventDefault();
                let favorites = JSON.parse(localStorage.getItem('favorites') || '[]');
                const idx = favorites.indexOf(window.location.pathname);
                
                if (idx > -1) {
                    favorites.splice(idx, 1);
                } else {
                    favorites.push(window.location.pathname);
                }
                localStorage.setItem('favorites', JSON.stringify(favorites));
                favoritesBtn.classList.toggle('active', favorites.includes(window.location.pathname));
            });
        }

        // Refresh button
        const refreshBtn = document.querySelector('.nav-btn.refresh');
        if (refreshBtn) {
            refreshBtn.addEventListener('click', function(e) {
                e.preventDefault();
                window.location.reload();
            });
        }

        // Categories button
        const categoriesBtn = document.querySelector('.nav-btn.categories');
        if (categoriesBtn) {
            categoriesBtn.addEventListener('click', function(e) {
                e.preventDefault();
                alert('Categories feature coming soon!');
            });
        });

        // Search button
        const searchBtn = document.querySelector('.nav-btn.search');
        if (searchBtn) {
            searchBtn.addEventListener('click', function(e) {
                e.preventDefault();
                const query = prompt('What would you like to search for?');
                if (query) {
                    alert(`Searching for: "${query}"`);
                }
            });
        }
    });
</script>
